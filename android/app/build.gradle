plugins { id 'com.android.application' }

android {
    namespace 'com.goldenyears.messages'
    compileSdk 34
    defaultConfig {
        applicationId 'com.goldenyears.messages'
        minSdk 21
        targetSdk 34
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1)
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }
    signingConfigs {
        release {
            storeFile file('../release.keystore')
            storePassword 'gymessages-ks'
            keyAlias 'gymessages'
            keyPassword 'gymessages-ks'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    lint { abortOnError false; checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
